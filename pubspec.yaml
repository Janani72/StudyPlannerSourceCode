name: smart_study_planner
description: A smart study planner app with Pomodoro timer, attendance tracking, and progress analytics.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.4.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Charts
  fl_chart: ^0.66.0
  table_calendar: ^3.0.9
  get: ^4.6.6

  # PDF Export
  pdf: ^3.10.4
  printing: ^5.11.1

  # Storage
  shared_preferences: ^2.2.2

  # Icons
  cupertino_icons: ^1.0.8

  # AI & Services
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  image_picker: ^1.0.7

  # Premium UI
  google_fonts: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.5+1
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/
  #   - assets/
  
  # To add custom fonts:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic